[package]
name = "chapter1"
version = "0.1.0"
edition = "2024"
# Da quando c'e' anche il broker di prova i binari sono due, e senza dirlo
# `cargo run` non saprebbe piu' quale far partire: resta il simulatore, che e'
# quello che si lancia sempre. Il broker si chiede per nome, `--bin broker`.
default-run = "chapter1"

[dependencies]
bevy = "0.18"
rand = "0.10.0"
# Gia' presenti nell'albero di Bevy: non allungano la compilazione.
ron = "0.12"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
# MQTT: il client lo usa il simulatore, il broker il binario di prova. Senza le
# funzioni di serie perche' quelle portano TLS, che su una rete di stabilimento
# chiusa non serve e in compilazione pesa.
rumqttc = { version = "0.25", default-features = false }
rumqttd = { version = "0.20", default-features = false }
# I messaggi sul bus sono JSON e non RON: il programma di comando dall'altra
# parte non e' detto che sia scritto in Rust, e questa e' la lingua che leggono
# tutti. Dentro il repo invece i file restano RON.
serde_json = "1"

# Enable a small amount of optimization in the dev profile
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies
[profile.dev.package."*"]
opt-level = 3

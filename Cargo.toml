[package]
name = "chapter1"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18"
rand = "0.10.0"
# Gia' presenti nell'albero di Bevy: non allungano la compilazione.
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Enable a small amount of optimization in the dev profile
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies
[profile.dev.package."*"]
opt-level = 3
